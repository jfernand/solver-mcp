[package]
name = "solver-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing Pumpkin (CP) and microlp (LP/MILP) as an optimization brain for agents."

[dependencies]
# Pure-Rust Lazy Clause Generation constraint solver (ConSol Lab / TU Delft).
pumpkin-solver = "0.5.0"

# Pure-Rust MILP solver (fork of the archived minilp), used for the LP tools.
microlp = "0.6.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"

# Rust MCP SDK -- check crates.io for the current name/version; the tool
# bodies in csp_tools.rs / lp_tools.rs don't depend on this crate at all,
# only main.rs's registration/transport layer does.
rmcp = { version = "3" , features = ["server", "transport-io", "macros"]}
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
pumpkin-constraints = "0.5.0"

[[bin]]
name = "solver-mcp"
path = "src/main.rs"

[dev-dependencies]
# Client-side transport, used only by tests/mcp_server.rs to drive the
# compiled binary over stdio like a real MCP client would.
rmcp = { version = "3", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process"] }
